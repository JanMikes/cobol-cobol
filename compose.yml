services:
  web:
    image: ghcr.io/thedevs-cz/php:8.4
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./docker-entrypoint.sh:/usr/local/bin/docker-php-entrypoint
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgres
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal"
      XDEBUG_MODE: debug
      PHP_IDE_CONFIG: "serverName=localhost"
      SERVER_NAME: :80

  postgres:
    image: postgres:16-alpine
    container_name: cobolcobol_postgres
    environment:
      POSTGRES_DB: cobolcobol
      POSTGRES_USER: cobolcobol
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit:latest
    container_name: cobolcobol_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  adminer:
    image: adminer:5.3.0
    ports:
      - "8000:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
  caddy_data:
  caddy_config: